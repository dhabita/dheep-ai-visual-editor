<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 325" fill="none">
  <!-- Browser chrome -->
  <rect width="520" height="325" rx="16" fill="#f8fafc"/>
  <rect width="520" height="40" rx="16" fill="#e2e8f0"/>
  <rect x="0" y="24" width="520" height="16" fill="#e2e8f0"/>
  <!-- Browser dots -->
  <circle cx="20" cy="20" r="5" fill="#fc8181"/>
  <circle cx="36" cy="20" r="5" fill="#f6ad55"/>
  <circle cx="52" cy="20" r="5" fill="#68d391"/>
  <!-- URL bar -->
  <rect x="80" y="11" width="280" height="18" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="23" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">nimbus.app</text>

  <!-- Page content area -->
  <!-- Nav bar mock -->
  <rect x="20" y="56" width="480" height="30" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="32" y="65" width="40" height="10" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="340" y="65" width="36" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="386" y="65" width="36" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="432" y="63" width="52" height="14" rx="7" fill="#6366f1" opacity="0.2"/>

  <!-- Hero section mock -->
  <rect x="20" y="100" width="480" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="160" y="116" width="200" height="14" rx="4" fill="#1e293b" opacity="0.15"/>
  <rect x="195" y="138" width="130" height="10" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="210" y="157" width="100" height="22" rx="11" fill="#6366f1" opacity="0.15"/>

  <!-- Cards row mock -->
  <rect x="20" y="216" width="148" height="80" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="35" y="230" width="60" height="8" rx="3" fill="#e2e8f0"/>
  <rect x="35" y="246" width="100" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="35" y="258" width="80" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="35" y="276" width="50" height="10" rx="5" fill="#6366f1" opacity="0.15"/>

  <rect x="186" y="216" width="148" height="80" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="201" y="230" width="60" height="8" rx="3" fill="#e2e8f0"/>
  <rect x="201" y="246" width="100" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="201" y="258" width="80" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="201" y="276" width="50" height="10" rx="5" fill="#6366f1" opacity="0.15"/>

  <rect x="352" y="216" width="148" height="80" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="367" y="230" width="60" height="8" rx="3" fill="#e2e8f0"/>
  <rect x="367" y="246" width="100" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="367" y="258" width="80" height="6" rx="2" fill="#f1f5f9"/>
  <rect x="367" y="276" width="50" height="10" rx="5" fill="#6366f1" opacity="0.15"/>

  <!-- SELECTED element highlight — second card -->
  <rect x="183" y="213" width="154" height="86" rx="10" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="5 3"/>
  <!-- Selection corner handles -->
  <rect x="181" y="211" width="8" height="8" rx="2" fill="#6366f1"/>
  <rect x="329" y="211" width="8" height="8" rx="2" fill="#6366f1"/>
  <rect x="181" y="291" width="8" height="8" rx="2" fill="#6366f1"/>
  <rect x="329" y="291" width="8" height="8" rx="2" fill="#6366f1"/>
  <!-- Hover overlay on second card -->
  <rect x="183" y="213" width="154" height="86" rx="9" fill="#6366f1" opacity="0.06"/>

  <!-- Tooltip label above selected element -->
  <rect x="218" y="196" width="82" height="18" rx="5" fill="#6366f1"/>
  <text x="259" y="208" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="600" fill="#fff">div.card</text>
  <!-- Tooltip arrow -->
  <polygon points="252,214 259,221 266,214" fill="#6366f1"/>

  <!-- Cursor -->
  <g transform="translate(314, 258)">
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000030"/>
    </filter>
    <polygon points="0,0 0,22 5,17 9,26 12,25 8,16 15,16" fill="#1e293b" filter="url(#shadow)"/>
    <!-- Click ripple -->
    <circle cx="4" cy="3" r="10" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.3"/>
    <circle cx="4" cy="3" r="16" stroke="#6366f1" stroke-width="1" fill="none" opacity="0.15"/>
  </g>
</svg>
